# This is test the test the context information way is to create a workflow that 
# prints the common runtime context values such as runner , jobs, secrets, vars & etc
# Context lets your pipeline understand where, why, and how it is running, 
# so it can behave dynamically instead of hardcoding everything.

name: Context Information Test

on:
  push:
  workflow_dispatch:

env:
  GLOBAL_ENV: "global-env-value"
  APP_NAME: "context-demo"

jobs:
  context-test:
    name: Context Test on ${{ matrix.os }} with ${{ matrix.image }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        image: [hello-world, alpine]

    env:
      JOB_ENV: "job-level-env-value"
      IMAGE_NAME: ${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print GitHub context values
        run: |
          echo "Workflow Name       : ${{ github.workflow }}"
          echo "Event Name          : ${{ github.event_name }}"
          echo "Repository          : ${{ github.repository }}"
          echo "Actor               : ${{ github.actor }}"
          echo "Ref                 : ${{ github.ref }}"
          echo "Ref Name            : ${{ github.ref_name }}"
          echo "SHA                 : ${{ github.sha }}"
          echo "Run ID              : ${{ github.run_id }}"
          echo "Run Number          : ${{ github.run_number }}"
          echo "Job Name            : ${{ github.job }}"

      - name: Print runner and matrix info
        run: |
          echo "Runner OS           : ${{ runner.os }}"
          echo "Runner Architecture : ${{ runner.arch }}"
          echo "Matrix OS           : ${{ matrix.os }}"
          echo "Matrix Image        : ${{ matrix.image }}"

      - name: Print env values
        run: |
          echo "GLOBAL_ENV          : $GLOBAL_ENV"
          echo "APP_NAME            : $APP_NAME"
          echo "JOB_ENV             : $JOB_ENV"
          echo "IMAGE_NAME          : $IMAGE_NAME"

      - name: Print vars values
        run: |
          echo "ENVIRONMENT_NAME    : ${{ vars.ENVIRONMENT_NAME }}"
          echo "REGION              : ${{ vars.REGION }}"
          echo "PROJECT_CODE        : ${{ vars.PROJECT_CODE }}"
          echo "OWNER               : ${{ vars.OWNER }}"

      - name: Check if secrets are configured
        run: |
          if [ -n "${{ secrets.DEMO_SECRET }}" ]; then
            echo "DEMO_SECRET is configured"
          else
            echo "DEMO_SECRET is NOT configured"
          fi

          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "DOCKER_USERNAME secret is configured"
          else
            echo "DOCKER_USERNAME secret is NOT configured"
          fi

          if [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "DOCKER_PASSWORD secret is configured"
          else
            echo "DOCKER_PASSWORD secret is NOT configured"
          fi

      - name: Show full GitHub context as JSON
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Show full runner context as JSON
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"

      - name: Show full matrix context as JSON
        env:
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
        run: echo "$MATRIX_CONTEXT"

      - name: Show Docker version
        run: docker --version

      - name: Show Docker info
        run: docker info

      - name: Run hello-world image
        if: matrix.image == 'hello-world'
        run: docker run hello-world

      - name: Run alpine image
        if: matrix.image == 'alpine'
        run: docker run alpine echo "Alpine container executed successfully"
